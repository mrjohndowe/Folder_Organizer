name: Build and Release Folder Organizer

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Determine release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $version = "${{ inputs.version }}"

              if ($version.StartsWith("v")) {
                  $version = $version.Substring(1)
              }

              $tag = "v$version"
          }
          else {
              $tag = "${{ github.ref_name }}"
              $version = $tag.TrimStart("v")
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
              throw "Invalid release version: $version"
          }

          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

          Write-Host "Version: $version"
          Write-Host "Tag: $tag"

      - name: Restore packages
        run: dotnet restore FolderOrganizer.csproj

      - name: Publish Folder Organizer
        shell: pwsh
        run: |
          dotnet publish FolderOrganizer.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish\FolderOrganizer `
            -p:Version=$env:APP_VERSION

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
              $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $iscc)) {
              throw "Inno Setup compiler was not found."
          }

          & $iscc `
            "/DMyAppVersion=$env:APP_VERSION" `
            "installer\FolderOrganizer.iss"

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "installer\output\FolderOrganizer-Setup.exe"

          if (-not (Test-Path $installer)) {
              throw "Installer was not created."
          }

          $size = (Get-Item $installer).Length

          Write-Host "Installer created successfully."
          Write-Host "Size: $size bytes"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: FolderOrganizer-Setup-${{ env.APP_VERSION }}
          path: installer/output/FolderOrganizer-Setup.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Folder Organizer ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            installer/output/FolderOrganizer-Setup.exe
            installer/output/FolderOrganizer-Setup.msi
